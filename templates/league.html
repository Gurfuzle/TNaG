{% extends "base.html" %}
{% block title %}{{ league.name }} - MTG Corporate League{% endblock %}
{% block body_class %}page-bg{% endblock %}
{% block content %}
<section class="section">
    <div class="container">
        <h1>{{ league.name }}</h1>
        <div class="domo-embed">
            <iframe src="{{ league.domo_embed_url }}"
                    width="100%" height="1200"
                    frameborder="0"
                    allowfullscreen>
            </iframe>
        </div>
    </div>
</section>
{% endblock %}
